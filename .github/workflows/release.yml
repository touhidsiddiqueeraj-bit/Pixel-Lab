name: Release APK

# Builds the Pixel Lab Android app (Capacitor shell around the statically
# exported Next.js editor) and publishes it as a GitHub Release with the
# signed APK attached.
#
# Trigger: push a tag, e.g.  git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Export static web app
        run: npm run build:apk

      - name: Sync web assets into Android shell
        run: npx cap sync android

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing Pixel Lab ${VERSION} (versionCode ${GITHUB_RUN_NUMBER})"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -n "version" android/app/build.gradle | head -3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK and compute checksum
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" "PixelLab-${GITHUB_REF_NAME}.apk"
          SHA256=$(sha256sum "PixelLab-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)
          {
            echo "SHA256: \`$SHA256\`"
            echo ""
            echo "---"
            echo ""
            echo "**Install**"
            echo ""
            echo "1. Download \`PixelLab-${GITHUB_REF_NAME}.apk\` below"
            echo "2. Open it on your Android 6.0+ device and allow \"Install unknown apps\" for your browser/file manager when prompted"
            echo "3. Launch **Pixel Lab** from your app drawer"
            echo ""
            echo "The APK is self-contained (the full editor ships inside) and works offline. Luna, the AI assistant, needs internet access plus your own Gemini API key entered in the app settings."
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Pixel Lab ${{ github.ref_name }}
          body_path: release-body.md
          generate_release_notes: true
          files: PixelLab-*.apk
